org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false
org.gradle.daemon=true
# Windows: parallele Transformationen der grossen LibVLC-AAR kollidierten im Cache ("Could not move temporary workspace")
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Adresse der FRITZ!Box im Heimnetz (Quelle der Senderliste). Kann pro Build ueberschrieben werden:
#   gradlew assembleRelease -PfritzboxHost=192.168.x.y
fritzboxHost=192.168.200.1
